name: CI

# Branch rule for this organization: `main` is mainnet (Vercel production),
# `testnet` is testnet (Vercel preview). The build step pulls its
# NEXT_PUBLIC_* configuration from the Vercel project instead of duplicating
# it here, which needs three repository secrets:
#   VERCEL_TOKEN       a Vercel account/team token
#   VERCEL_ORG_ID      Vercel team id (Team Settings → General)
#   VERCEL_PROJECT_ID  Vercel project id (Project Settings → General)
# Both ids are also written by a local `vercel link` (`.vercel/repo.json` on
# CLI 54, `.vercel/project.json` on older CLIs).

on:
  pull_request:
  push:
    branches:
      - main
      - testnet

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # A push to `main` builds with the Production environment; a push to
      # `testnet` and every pull request build with the Preview environment,
      # resolved for the branch being built so branch-scoped preview values
      # apply the same way they do on Vercel's own deployments. The pulled
      # `.env.local` is gitignored and loaded by `next build` automatically.
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Branch names are user-controlled: keep them out of the script text.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            npx --yes vercel@59.13.1 env pull .env.local --yes --environment=production --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@59.13.1 env pull .env.local --yes --environment=preview \
              --git-branch="$GIT_BRANCH" --token="$VERCEL_TOKEN"
          fi

      - name: Build
        run: pnpm build
